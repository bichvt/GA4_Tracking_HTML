<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product 1 Details</title>
   
<!-- For check 1-2 only: a pre-existing dataLayer queue, placed BEFORE both snippets.
     After load, dataLayer[0] must still be this object. Delete this block when the check is done. -->
<script>
  window.dataLayer = window.dataLayer || [];
  dataLayer.push({ pre_existing: 1 });
</script>

<!-- Google Tag Manager A: GTM-M882RMPT (new snippet, unchanged) -->
<script async src="https://www.googletagmanager.com/gtm.js?id=GTM-M882RMPT"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
</script>
<!-- End Google Tag Manager A-->

<!-- Google Tag Manager B: GTM-TKZLFBZD -->
<script async src="https://www.googletagmanager.com/gtm.js?id=GTM-TKZLFBZD"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
</script>
<!-- End Google Tag Manager B-->



</head>
<body>
    <h1>Product 1</h1>
    <img src="product1.jpg" alt="Product 1 Image">
    <p>Price: $80</p>
    <p>Quantity: <input type="number" id="quantity" value="1"></p>
    <button onclick="saveOrder()">Order Now</button>

    <!-- A button that pushes ONE custom event; both containers get a trigger on this event name. -->
    <button onclick="pushTestEvent()">Push test_event</button>

    <script>
        function saveOrder() {
            const price = 80;
            const quantity = document.getElementById('quantity').value;

            sessionStorage.setItem('productPrice', price);
            sessionStorage.setItem('productQuantity', quantity);

            // Push an event and STAY on the page.
            // The original redirect (window.location.href = 'Confirm_Order.html') unloads the page and can cancel
            // the hits and hides Tag Assistant's timeline. Put it back after the test.
            dataLayer.push({ event: 'order_now', value: price * quantity, quantity: Number(quantity) });
        }

        var testCount = 0;
        function pushTestEvent() {
            testCount++;
            dataLayer.push({ event: 'test_event', test_id: 'T' + testCount });
        }
    </script>
</body>
</html>
